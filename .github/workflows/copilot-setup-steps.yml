# Development environment for the GitHub Copilot coding agent.
# The job must be named `copilot-setup-steps`.
# Docs: https://docs.github.com/en/copilot/how-tos/agents/copilot-coding-agent/customizing-the-development-environment-for-copilot-coding-agent

name: "GitHub Copilot Code Agent Development Environment Setup"

"on":
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

env:
  PYTHON_VERSION: "3.13"  # renovate: datasource=python-version
  TIMEZONE: "Asia/Tokyo"
  TWITTER_COOKIES_PATH: "/app/data/cookies.json"
  TWITTER_USERS_FILE: "/app/data/users.json"
  TWITTER_BLOCK_DB: "/app/data/block_history.db"
  CACHE_DIR: "/app/data/cache"

jobs:
  copilot-setup-steps:
    name: "Development Environment Setup"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history: the version is derived from git tags

      - name: "Setup Python Environment"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: "Configure Timezone"
        run: |
          sudo timedatectl set-timezone ${{ env.TIMEZONE }}
          echo "Timezone set to ${{ env.TIMEZONE }}"
          date

      - name: "Install System Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sqlite3 \
            tzdata \
            curl \
            jq \
            tree

      - name: "Upgrade Python Package Manager"
        run: |
          python3 -m pip install --upgrade pip==25.1.1  # renovate: datasource=pypi depName=pip
          echo "pip upgraded: $(pip --version)"

      - name: "Install Project Dependencies"
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
            pip list
          else
            echo "requirements.txt not found"
            exit 1
          fi

      - name: "Install Development Tools"
        run: |
          pip install \
            black \
            flake8 \
            mypy \
            pytest \
            pytest-cov \
            ipython \
            jupyter

      - name: "Validate Project Module"
        run: |
          python3 -c "import twitter_blocker; print('twitter_blocker imported successfully')"
          python3 -m twitter_blocker --version || echo "Could not read the version (expected in a development checkout)"
          python3 -m twitter_blocker --help
